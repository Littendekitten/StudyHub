services:
  - type: web
    name: studyhub-vip-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    healthCheckPath: /api/health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: kitacat-studyhub
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
